[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
common = { version = "0.1.0", path = "../../input/common" }
cosmic-text = "0.19"
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.36", default-features = false }
glyphon = "0.12"
libc = "0.2.190"
pollster = "1.0.1"
raw-window-handle = "0.6"
serde_json = "1.0.154"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wgpu = "30"
xkbcommon = "0.9"
