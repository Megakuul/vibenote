[package]
name = "vibenote-storage"
description = "SQLite workspace store + content-addressed blob store (ADR 0005)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vibenote-geom = { path = "../geom" }
vibenote-model = { path = "../model" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
blake3 = "1.8"

[dev-dependencies]
proptest = "1"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
