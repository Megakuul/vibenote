[package]
name = "vibenote-audio"
description = "Audio recording/playback and ink sync (ADR 0009)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vibenote-model = { path = "../model" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Opus (libopus, BSD-3-Clause) in Ogg (BSD-3-Clause), ADR 0009 decision 2.
opus = "0.4"
ogg = "0.9"
# Import (owner-approved MPL-2.0, unmodified): WAV, FLAC, MP3, Ogg Vorbis.
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis"] }
# Capture and playback through PipeWire (ADR 0009 decision 1).
cpal = { version = "0.18", features = ["pipewire"], optional = true }

[features]
default = ["device"]
device = ["dep:cpal"]
