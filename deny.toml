# Licence policy (AGENTS.md §3 "Dependencies, assets, licenses"). GPL/AGPL/LGPL need owner approval.
[graph]
all-features = false

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "0BSD", "Unlicense",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Owner-approved exceptions (2026-10-11): symphonia (MPL-2.0) for audio import, used unmodified.
# symphonia is published as several crates of the same project and licence; all are listed.
exceptions = [
    { allow = ["MPL-2.0"], crate = "symphonia" },
    { allow = ["MPL-2.0"], crate = "symphonia-bundle-flac" },
    { allow = ["MPL-2.0"], crate = "symphonia-bundle-mp3" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-vorbis" },
    { allow = ["MPL-2.0"], crate = "symphonia-core" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-ogg" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-riff" },
    { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
    { allow = ["MPL-2.0"], crate = "symphonia-utils-xiph" },
    # Agent, 2026-10-18 (ADR 0012): Mozilla's root certificates as data (permissive). Listed by
    # rustls-platform-verifier only for wasm32 targets, so it is never built or shipped here;
    # the backup uses the system trust store.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[licenses.private]
# Our own unpublished workspace crates (publish = false).
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
