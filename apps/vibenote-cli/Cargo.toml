[package]
name = "vibenote-cli"
description = "Command-line interface: run commands, inspect state, serve the control channel."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vibenote-engine = { path = "../../crates/engine" }
vibenote-hwr = { path = "../../crates/hwr" }
vibenote-control = { path = "../../crates/control" }
vibenote-render = { path = "../../crates/render" }
vibenote-ink = { path = "../../crates/ink" }
vibenote-model = { path = "../../crates/model" }
serde_json = { version = "1", features = ["float_roundtrip"] }


[dev-dependencies]
tempfile = "3"
vibenote-storage = { path = "../../crates/storage" }
